<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth</title>
    <link rel="icon" href="textures/earth-favicon-16.png" sizes="16x16" type="image/png">
    <link rel="icon" href="textures/earth-favicon-32.png" sizes="32x32" type="image/png">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <!-- Loading -->
    <div id="loading" class="loading-overlay">
        <div class="loading-text">Loading Earth</div>
    </div>

    <!-- Globe -->
    <div id="globe-container"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="app-title">Earth</div>
        <div class="top-actions">
            <button id="btn-rotate" class="btn" title="Toggle auto-rotation">Rotate</button>
        </div>
    </div>

    <!-- Country Info Panel -->
    <div id="info-panel" class="info-panel">
        <div class="info-panel-header">
            <h2><span id="info-flag" class="flag"></span> <span id="info-name"></span></h2>
            <button id="info-close" class="info-panel-close">&times;</button>
        </div>
        <div class="info-meta">
            <div class="info-meta-item">Capital <span id="info-capital"></span></div>
            <div class="info-meta-item">Population <span id="info-population"></span></div>
            <div class="info-meta-item">Continent <span id="info-continent"></span></div>
            <div class="info-meta-item">Languages <span id="info-languages"></span></div>
        </div>
        <div class="info-divider"></div>
        <div class="info-fact-label">Random Fact</div>
        <div id="info-fact-text" class="info-fact"></div>
        <button id="btn-new-fact" class="btn-new-fact">Show Another Fact</button>
    </div>

    <!-- Hint -->
    <div class="hint">Click any country to explore</div>

    <script type="module" src="./js/script.js"></script>
    <script src="./js/metrics-tracking.js"></script>
</body>
</html>
